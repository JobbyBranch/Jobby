function MatcherView({ enriched, mState, setMState }) {
  const { cvText, cvName, result } = mState;
  const details = mState.details || {};
  const [busy, setBusy] = useState(false);
  const [reading, setReading] = useState(false);
  const [error, setError] = useState(null);
  const [pasteOpen, setPasteOpen] = useState(false);
  const [pasteText, setPasteText] = useState("");
  const [dragOver, setDragOver] = useState(false);
  const [openId, setOpenId] = useState(null);
  const [detailBusy, setDetailBusy] = useState(null);
  const fileRef = React.useRef(null);

  const matchJobs = useMemo(() => {
    const cutoff = Date.now() - 21 * 86400000;
    return enriched.filter((j) => {
      if (!j.iso) return true;                       // geen datum (bv. manueel toegevoegd) — meenemen
      const t = new Date(j.iso).getTime();
      return !isFinite(t) || t >= cutoff;
    });
  }, [enriched]);
  const jobCount = matchJobs.length;
  const setCv = (text, name) => setMState((p) => ({ ...p, cvText: text, cvName: name, result: null, details: {} }));

  const handleFile = async (file) => {
    if (!file) return;
    setError(null);
    const isPdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name);
    const isTxt = file.type.startsWith("text/") || /\.(txt|md)$/i.test(file.name);
    if (!isPdf && !isTxt) { setError("Alleen PDF- of tekstbestanden — of plak de CV-tekst hieronder."); return; }
    setReading(true);
    try {
      const text = isPdf ? await extractPdfText(file) : (await file.text()).trim();
      if (!text || text.length < 80) throw new Error("Er kon bijna geen tekst uit dit bestand gehaald worden (gescande PDF?). Plak de CV-tekst dan handmatig.");
      setCv(text, file.name);
      setPasteOpen(false);
    } catch (e) {
      setError(String(e.message || e));
    } finally {
      setReading(false);
    }
  };

  const runMatch = () => {
    if (!cvText || busy) return;
    setBusy(true);
    setError(null);
    setOpenId(null);
    const jobList = matchJobs.slice(0, 400);
    const prompt = buildMatcherPrompt(cvText, jobList);
    fetch("/api/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ messages: [{ role: "user", content: prompt }] }) })
      .then(async (r) => {
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error || `fout ${r.status}`);
        const parsed = parseMatcherAnswer(d.answer);
        const seen = new Set();
        const rows = parsed.matches
          .map((m) => ({ job: resolveMatchedJob(m, jobList), score: Math.max(0, Math.min(100, Math.round(+m.score || 0))), reden: String(m.reden || "") }))
          .filter((m) => m.job && !seen.has(m.job.id) && seen.add(m.job.id))
          .sort((a, b) => b.score - a.score);
        if (parsed.matches.length > 0 && rows.length === 0) {
          setMState((p) => ({ ...p, result: null }));
          throw new Error(`De AI gaf ${parsed.matches.length} matches terug, maar ze konden niet aan vacatures gekoppeld worden. Ruw antwoord (begin): ${String(d.answer || "").slice(0, 400)}`);
        }
        setMState((p) => ({ ...p, details: {}, result: { profiel: parsed.profiel || {}, rows, aiEmpty: parsed.matches.length === 0, raw: String(d.answer || ""), screened: jobList.length, at: Date.now() } }));
      })
      .catch((e) => setError("Matchen mislukt: " + String(e.message || e)))
      .finally(() => setBusy(false));
  };

  const loadDetail = (m) => {
    const id = m.job.id;
    if (details[id] || detailBusy === id || !cvText) return;
    setDetailBusy(id);
    fetch("/api/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ messages: [{ role: "user", content: buildDetailPrompt(cvText, m.job) }] }) })
      .then(async (r) => {
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error || `fout ${r.status}`);
        const text = String(d.answer || "").trim();
        setMState((p) => ({ ...p, details: { ...(p.details || {}), [id]: text || "Geen analyse ontvangen." } }));
      })
      .catch((e) => setMState((p) => ({ ...p, details: { ...(p.details || {}), [id]: "Analyse ophalen mislukt: " + String(e.message || e) } })))
      .finally(() => setDetailBusy(null));
  };

  const toggleRow = (m) => {
    const id = m.job.id;
    if (openId === id) { setOpenId(null); return; }
    setOpenId(id);
    loadDetail(m);
  };

  const reset = () => { setMState({ cvText: "", cvName: "", result: null, details: {} }); setPasteText(""); setPasteOpen(false); setError(null); setOpenId(null); };
  const prof = result?.profiel || {};
  const topRows = result ? result.rows.filter((m) => m.score >= 80) : [];
  const otherRows = result ? result.rows.filter((m) => m.score < 80) : [];

  return (
    <>
      <PageHeader
        title="1-on-1 Matcher"
        subtitle="Upload één CV en de AI screent het tegen alle vacatures van de laatste 3 weken — topmatches bovenaan, met per job de reden"
        action={result && (
          <button onClick={reset} className="flex items-center gap-1.5 text-[13.5px] font-bold px-3.5 h-9 rounded-[10px] transition-colors hover:bg-gray-50" style={{ border: `1px solid ${T.line}`, color: T.sub }}>
            <RefreshCw size={13} /> Nieuw CV
          </button>
        )}
      />

      {!result && (
        <div style={cardStyle} className="p-5 mb-5">
          {!cvText ? (
            <>
              <div
                onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
                onDragLeave={() => setDragOver(false)}
                onDrop={(e) => { e.preventDefault(); setDragOver(false); handleFile(e.dataTransfer.files?.[0]); }}
                onClick={() => fileRef.current?.click()}
                className="flex flex-col items-center justify-center gap-2 py-10 rounded-[12px] cursor-pointer transition-colors"
                style={{ border: `2px dashed ${dragOver ? T.blue : T.line}`, background: dragOver ? T.blueSoft : "#FAFBFE" }}
              >
                <div className="rounded-[12px] p-2.5" style={{ background: T.blueSoft }}><Upload size={20} color={T.blue} strokeWidth={2.2} /></div>
                <p className="text-[14.5px] font-bold">{reading ? "CV wordt gelezen…" : "Sleep een CV hierheen of klik om te kiezen"}</p>
                <p className="text-[13px] font-medium" style={{ color: T.faint }}>PDF of tekstbestand — wordt nergens opgeslagen</p>
              </div>
              <input ref={fileRef} type="file" accept=".pdf,.txt,.md,application/pdf,text/plain" className="hidden" onChange={(e) => { handleFile(e.target.files?.[0]); e.target.value = ""; }} />
              <div className="mt-3">
                {!pasteOpen ? (
                  <button onClick={() => setPasteOpen(true)} className="text-[13px] font-semibold hover:underline" style={{ color: T.blue }}>Liever de CV-tekst plakken?</button>
                ) : (
                  <div>
                    <textarea value={pasteText} onChange={(e) => setPasteText(e.target.value)} rows={7} placeholder="Plak hier de volledige CV-tekst…"
                      className="w-full px-3.5 py-3 rounded-[10px] text-[13.5px] font-medium outline-none resize-y" style={{ background: "#F4F5F9", border: `1px solid ${T.line}` }} />
                    <button onClick={() => { const t = pasteText.trim(); if (t.length < 80) { setError("Plak wat meer tekst — dit is te kort om te screenen."); return; } setCv(t, "Geplakte tekst"); }}
                      disabled={!pasteText.trim()}
                      className="mt-2 text-[13.5px] font-bold px-4 h-9 rounded-[10px] text-white transition-opacity hover:opacity-90 disabled:opacity-50" style={{ background: T.grad }}>
                      Gebruik deze tekst
                    </button>
                  </div>
                )}
              </div>
            </>
          ) : (
            <div className="flex items-center gap-3 flex-wrap">
              <div className="flex items-center justify-center w-10 h-10 rounded-[12px] shrink-0" style={{ background: T.blueSoft }}><FileText size={18} color={T.blue} /></div>
              <div className="min-w-0 flex-1">
                <div className="text-[14.5px] font-bold truncate">{cvName}</div>
                <div className="text-[12.5px] font-medium" style={{ color: T.faint }}>{cvText.length.toLocaleString("nl-BE")} tekens gelezen</div>
              </div>
              <button onClick={reset} className="text-[13px] font-semibold px-3 h-9 rounded-[10px] transition-colors hover:bg-gray-50" style={{ border: `1px solid ${T.line}`, color: T.sub }}>Verwijder</button>
              <button onClick={runMatch} disabled={busy || jobCount === 0} className="text-[13.5px] font-bold px-4 h-9 rounded-[10px] text-white transition-opacity hover:opacity-90 disabled:opacity-50" style={{ background: T.grad }}>
                {busy ? "Bezig met screenen…" : `Match met ${jobCount} vacatures uit de laatste 3 weken`}
              </button>
            </div>
          )}
        </div>
      )}

      {error && (
        <div style={{ ...cardStyle, borderColor: "rgba(220,38,38,0.3)" }} className="p-4 mb-5 flex items-start gap-3">
          <div className="rounded-xl p-2 shrink-0" style={{ background: T.redSoft }}><Info size={16} color={T.red} strokeWidth={2.2} /></div>
          <p className="text-[13.5px] font-medium leading-relaxed" style={{ color: T.sub }}>{error}</p>
        </div>
      )}

      {busy && (
        <div style={cardStyle} className="p-5 mb-5 flex items-center gap-3">
          <RefreshCw size={16} color={T.blue} className="spin" />
          <p className="text-[14px] font-semibold" style={{ color: T.sub }}>Het CV wordt gescreend tegen {jobCount} vacatures uit de laatste 3 weken — dit duurt een paar seconden…</p>
        </div>
      )}

      {result && (
        <>
          <div style={cardStyle} className="p-5 mb-5">
            <div className="flex items-center gap-3 flex-wrap">
              <div className="flex items-center justify-center w-11 h-11 rounded-full text-[14px] font-bold text-white shrink-0" style={{ background: T.grad }}>
                {(prof.naam || cvName || "CV").split(/\s+/).map((w) => w[0]).join("").slice(0, 2).toUpperCase()}
              </div>
              <div className="min-w-0 flex-1">
                <div className="text-[16px] font-bold tracking-tight truncate">{prof.naam || cvName}</div>
                <div className="text-[13.5px] font-medium" style={{ color: T.sub }}>
                  {[prof.titel, prof.jaren ? `${prof.jaren} jaar ervaring` : null].filter(Boolean).join(" · ") || "Profiel uit het CV"}
                </div>
              </div>
            </div>
            {Array.isArray(prof.skills) && prof.skills.length > 0 && (
              <div className="flex items-center gap-1.5 flex-wrap mt-3">
                {prof.skills.slice(0, 8).map((sk) => (
                  <span key={sk} className="text-[12px] font-semibold px-2 py-[3px] rounded-md" style={{ background: "#F3F4F8", color: T.sub }}>{sk}</span>
                ))}
              </div>
            )}
          </div>

          {topRows.length > 0 && (
            <>
              <div className="flex items-center gap-2 mb-2.5 px-1">
                <div className="flex items-center justify-center w-7 h-7 rounded-[9px]" style={{ background: T.pinkSoft }}><Flame size={14} color={T.pink} /></div>
                <span className="text-[15px] font-bold tracking-tight">Topmatches</span>
                <span className="text-[12px] font-bold px-2 py-[2px] rounded-full" style={{ background: T.pinkSoft, color: T.pink }}>{topRows.length}</span>
                <span className="text-[12.5px] font-medium" style={{ color: T.faint }}>· 80% of hoger — klik open voor de volledige analyse</span>
              </div>
              <div style={{ ...cardStyle, borderColor: "rgba(236,72,153,0.25)", boxShadow: "0 1px 2px rgba(236,72,153,0.06), 0 8px 24px rgba(236,72,153,0.07)" }} className="overflow-hidden mb-6">
                {topRows.map((m, i) => (
                  <MatchRow key={m.job.id} m={m} isTop isLast={i === topRows.length - 1} open={openId === m.job.id} onToggle={() => toggleRow(m)} detail={details[m.job.id]} detailBusy={detailBusy === m.job.id} />
                ))}
              </div>
            </>
          )}

          {otherRows.length > 0 && (
            <>
              <div className="flex items-center gap-2 mb-2.5 px-1">
                <span className="text-[15px] font-bold tracking-tight">Andere matches</span>
                <span className="text-[12px] font-bold px-2 py-[2px] rounded-full" style={{ background: "#F3F4F8", color: T.faint }}>{otherRows.length}</span>
              </div>
              <div style={cardStyle} className="overflow-hidden">
                {otherRows.map((m, i) => (
                  <MatchRow key={m.job.id} m={m} isTop={false} isLast={i === otherRows.length - 1} open={openId === m.job.id} onToggle={() => toggleRow(m)} detail={details[m.job.id]} detailBusy={detailBusy === m.job.id} />
                ))}
              </div>
            </>
          )}

          {result.rows.length === 0 && (
            <div style={cardStyle} className="px-5 py-14 text-center">
              <p className="text-[15px] font-semibold" style={{ color: T.sub }}>De AI vond geen vacature die 40% of hoger scoort op dit CV</p>
              <p className="text-[13.5px] font-medium mt-1" style={{ color: T.faint }}>Er werden {result.screened || jobCount} vacatures uit de laatste 3 weken gescreend. Probeer een ander CV, of bekijk hieronder het ruwe AI-antwoord.</p>
              {result.raw && (
                <details className="mt-4 text-left mx-auto" style={{ maxWidth: 560 }}>
                  <summary className="text-[12.5px] font-bold cursor-pointer" style={{ color: T.blue }}>Toon ruw AI-antwoord</summary>
                  <pre className="text-[11.5px] font-medium mt-2 p-3 rounded-[10px] whitespace-pre-wrap" style={{ background: "#F4F5F9", color: T.sub, maxHeight: 220, overflow: "auto" }}>{result.raw.slice(0, 2000)}</pre>
                </details>
              )}
            </div>
          )}
          <p className="text-[12px] font-medium mt-2.5" style={{ color: T.faint }}>Enkel vacatures uit de laatste 3 weken worden gescreend · scores van 40%+ worden getoond, maximum 15 · 80%+ telt als topmatch · het CV wordt niet bewaard.</p>
        </>
      )}
    </>
  );
}

function JobRadar() {
  const [view, setView] = useState("dashboard");
  const [matcherState, setMatcherState] = useState({ cvText: "", cvName: "", result: null });
  const [emailDraft, setEmailDraft] = useState(null);
  const [wf, setWf] = useState(null);            // shared team workflow (null = API offline)
  const [askWho, setAskWho] = useState(null);    // pending claim awaiting a name
  const [noteFor, setNoteFor] = useState(null);  // {key, text} — note editor open
  const [fbFor, setFbFor] = useState(null);      // {key, text} — feedback editor open
  const [lushaFor, setLushaFor] = useState(null); // company name — hiring-manager search open
  const [manualJobs, setManualJobs] = useState([]);
  const [addJobOpen, setAddJobOpen] = useState(false);
  useEffect(() => {
    fetch("/api/manual").then((r) => (r.ok ? r.json() : [])).then((d) => setManualJobs(Array.isArray(d) ? d : [])).catch(() => {});
  }, []);
  useEffect(() => {
    fetch("/api/workflow").then((r) => (r.ok ? r.json() : null)).then(setWf).catch(() => setWf(null));
  }, []);
  // auto-sync: verse kandidatenlijst bij elke opening, als er een sheet-link bewaard is
  useEffect(() => {
    let url = "";
    try { url = localStorage.getItem("jobradar-sheet-url") || ""; } catch (e) {}
    if (!url) return;
    fetch(url)
      .then((r) => { if (!r.ok) throw new Error("fetch " + r.status); return r.text(); })
      .then((text) => {
        const rows = parseCsv(text);
        const cands = sheetRowsToCandidates(rows);
        if (cands.length > 0) {
          setCandidates(cands);
          setSyncInfo({ time: new Date().toLocaleTimeString("nl-BE", { hour: "2-digit", minute: "2-digit" }), count: cands.length });
        }
      })
      .catch(() => {});   // stil falen: bewaarde lijst blijft gewoon staan
  }, []);
  const postWf = (body) => {
    fetch("/api/workflow", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) })
      .then((r) => (r.ok ? r.json() : null)).then((d) => { if (d) setWf(d); })
      .catch(() => {});
  };
  const withIdentity = (fn) => setAskWho(() => fn);
  const saveIdentity = (name) => {
    const n = (name || "").trim();
    if (!n) return;
    if (askWho) askWho(n);
    setAskWho(null);
  };
  const pipelineCount = wf ? Object.values(wf.interests || {}).filter((x) => x.status === "yes").length : 0;
  const wfApi = wf === null ? null : {
    interests: wf.interests || {},
    claims: wf.claims || {},
    setInterest: (jobUrl, candName, status, meta) => postWf({ action: "interest", jobUrl, row: candName, status, cand: candName, ...(meta || {}) }),
    setStage: (key, stage) => postWf({ action: "stage", key, stage }),
    setNote: (key, note) => postWf({ action: "note", key, note }),
    openNote: (key, existing) => setNoteFor({ key, text: existing || "" }),
    setFeedback: (key, feedback) => postWf({ action: "feedback", key, feedback }),
    openFeedback: (key, existing) => setFbFor({ key, text: existing || "" }),
    setClaim: (company, owner) => postWf({ action: "claim", company, owner }),
    withIdentity,
  };
  const [collapsed, setCollapsed] = useState(false);
  const [jobs, setJobs] = useState(INITIAL_JOBS);
  const [sources, setSources] = useState(INITIAL_SOURCES);
  const [expanded, setExpanded] = useState(1);
  const [query, setQuery] = useState("");
  const [simIndex, setSimIndex] = useState(0);
  const [toast, setToast] = useState(null);
  const [candidates, setCandidates] = useState(() => {
    try {
      const saved = localStorage.getItem("jobradar-candidates");
      if (saved) { const arr = JSON.parse(saved); if (Array.isArray(arr) && arr.length) return arr; }
    } catch (e) {}
    return CANDIDATES;
  });
  useEffect(() => {
    try { localStorage.setItem("jobradar-candidates", JSON.stringify(candidates)); } catch (e) {}
  }, [candidates]);

  /* ── company blacklist (persisted in this browser) ── */
  const [blacklist, setBlacklist] = useState(() => {
    try { const s = JSON.parse(localStorage.getItem("jobradar-blacklist") || "[]"); return Array.isArray(s) ? s : []; } catch (e) { return []; }
  });
  useEffect(() => {
    try { localStorage.setItem("jobradar-blacklist", JSON.stringify(blacklist)); } catch (e) {}
  }, [blacklist]);
  const isBlacklisted = (company) => blacklist.some((b) => b.trim().toLowerCase() === String(company || "").trim().toLowerCase());

  /* ── "Checken" status per vacature in Top Matches (persisted in this browser) ── */
  const [checking, setChecking] = useState(() => {
    try { const s = JSON.parse(localStorage.getItem("jobradar-checking") || "[]"); return Array.isArray(s) ? s : []; } catch (e) { return []; }
  });
  useEffect(() => {
    try { localStorage.setItem("jobradar-checking", JSON.stringify(checking)); } catch (e) {}
  }, [checking]);
  const markChecking = (id) => setChecking((p) => (p.includes(id) ? p : [...p, id]));

  const [dataMode, setDataMode] = useState("demo");
  const [dataUrl, setDataUrl] = useState(LIVE_DATA_URL);
  const [syncing, setSyncing] = useState(false);
  const [syncInfo, setSyncInfo] = useState(null);

  const connectLiveData = async (url) => {
    if (!url) return;
    setSyncing(true);
    setSyncInfo(null);
    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const data = await r.json();
      if (!Array.isArray(data)) throw new Error("expected a JSON array (latest.json)");
      const mapped = mapScraperJobs(data);
      setJobs(mapped);
      setDataMode("live");
      setExpanded(mapped[0]?.id ?? null);
      const time = new Date().toLocaleTimeString("nl-BE", { hour: "2-digit", minute: "2-digit" });
      setSyncInfo({ time, count: mapped.length });
      setToast(`Live data connected — ${mapped.length} vacancies loaded`);
      setTimeout(() => setToast(null), 3200);
    } catch (e) {
      setSyncInfo({ error: e.message });
    } finally {
      setSyncing(false);
    }
  };

  useEffect(() => { if (LIVE_DATA_URL) connectLiveData(LIVE_DATA_URL); }, []);

  const resetDemo = () => {
    setJobs(INITIAL_JOBS);
    setDataMode("demo");
    setSyncInfo(null);
    setExpanded(1);
  };

  const allJobs = useMemo(() => {
    const now = Date.now();
    const mapped = manualJobs.map((m) => {
      const v = companyVisual(m.company || "?");
      const fs = m.first_seen ? new Date(m.first_seen) : null;
      return { id: `manual-${m.id}`, manualId: m.id, company: m.company, logo: v.logo, logoColor: v.color,
               title: m.title, iso: m.first_seen || "", stack: (m.stack || []).slice(0, 6), exp: "",
               url: `manual:${m.id}`, ai_matches: m.ai_matches || null, contact: null, file: m.file || null,
               isNew: fs ? (now - fs.getTime()) / 86400000 < 2 : true };
    });
    return [...mapped, ...jobs].filter((j) => !isBlacklisted(j.company));
  }, [jobs, manualJobs, blacklist]);

  const blacklistCompany = (company) => {
    if (!company || isBlacklisted(company)) return;
    const hidden = allJobs.filter((j) => String(j.company).toLowerCase() === String(company).toLowerCase()).length;
    if (!confirm(`${company} blacklisten?\n\n${hidden} vacature${hidden !== 1 ? "s" : ""} van dit bedrijf worden verborgen, en toekomstige vacatures worden automatisch overgeslagen.\n\nOngedaan maken kan onderaan de CV-database.`)) return;
    setBlacklist((p) => [...p, company]);
    setToast(`${company} geblacklist — ${hidden} vacature${hidden !== 1 ? "s" : ""} verborgen`);
    setTimeout(() => setToast(null), 3200);
  };
  const enriched = useMemo(() => allJobs.map((j) => ({ ...j, matches: resolveAiMatches(j, candidates) || matchCandidates(j, candidates) })), [allJobs, candidates]);
  const strongJobs = useMemo(
    () => enriched
      .filter((j) => j.matches && j.matches[0] && j.matches[0].ai && j.matches[0].score >= 75)
      .sort((a, b) => b.matches[0].score - a.matches[0].score),
    [enriched]);
  const strongCount = strongJobs.length;
  const searchFiltered = enriched.filter((j) => {
    const q = query.toLowerCase();
    return j.company.toLowerCase().includes(q) || j.title.toLowerCase().includes(q) || j.stack.some((s) => s.includes(q));
  });
  const visibleJobs = useMemo(() => jobs.filter((j) => !isBlacklisted(j.company)), [jobs, blacklist]);
  const newCount = visibleJobs.filter((j) => j.isNew).length;

  const simulate = () => {
    const next = SIMULATED_JOBS[simIndex % SIMULATED_JOBS.length];
    const job = { ...next, id: Date.now(), iso: new Date().toISOString().slice(0, 10), isNew: true };
    setJobs((p) => [job, ...p]);
    setSimIndex((i) => i + 1);
    setExpanded(job.id);
    setToast(`New vacancy at ${next.company} — matched against ${candidates.length} CVs`);
    setTimeout(() => setToast(null), 3200);
  };

  return (
    <div className="min-h-screen flex" style={{ background: T.bg, color: T.ink, fontFamily: "'Inter', system-ui, sans-serif" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        * { -webkit-font-smoothing: antialiased; }
        @keyframes slideIn { from { transform: translateY(-10px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }
        .tip { position: relative; }
      .tip:hover::after {
        content: attr(data-tip);
        position: absolute;
        bottom: calc(100% + 8px);
        left: 50%;
        transform: translateX(-50%);
        background: #1B1E2B;
        color: #fff;
        font-size: 12.5px;
        font-weight: 500;
        line-height: 1.45;
        padding: 8px 11px;
        border-radius: 9px;
        white-space: pre-wrap;
        width: max-content;
        max-width: 260px;
        z-index: 60;
        box-shadow: 0 8px 24px rgba(15,17,26,0.25);
        pointer-events: none;
      }
      .tip:hover::before {
        content: "";
        position: absolute;
        bottom: calc(100% + 3px);
        left: 50%;
        transform: translateX(-50%);
        border: 5px solid transparent;
        border-top-color: #1B1E2B;
        z-index: 60;
        pointer-events: none;
      }
      @keyframes glowpulse {
        0%, 100% { box-shadow: 0 0 6px rgba(236, 72, 153, 0.45); }
        50% { box-shadow: 0 0 14px rgba(236, 72, 153, 0.75); }
      }
      .glowpulse { animation: glowpulse 2.4s ease-in-out infinite; }
      .slide { animation: slideIn .3s cubic-bezier(.2,.8,.3,1) }
        @keyframes expand { from { opacity: 0; transform: translateY(-4px) } to { opacity: 1; transform: translateY(0) } }
        .expand { animation: expand .25s ease-out }
        @keyframes glow { 0%,100% { opacity:1 } 50% { opacity:.4 } }
        .glow { animation: glow 1.6s infinite }
        @keyframes spin360 { to { transform: rotate(360deg) } }
        .spin { animation: spin360 1s linear infinite }
        .row-hover { transition: background .15s ease }
        .row-hover:hover { background: #FAFBFE }
        input::placeholder { color: #9DA1B4 }
        input[type=range] { height: 4px }
        .trend-row { display: grid; grid-template-columns: 1fr auto; }
        @media (min-width: 768px) { .trend-row { grid-template-columns: 1fr 2fr 90px 100px 90px; } }
        .source-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; }
        @media (min-width: 768px) { .source-row { grid-template-columns: 180px 1fr 110px 90px; } }
      `}</style>

      <Sidebar view={view} setView={setView} collapsed={collapsed} setCollapsed={setCollapsed} newCount={newCount} candidatesCount={candidates.length}  strongCount={strongCount}  pipelineCount={pipelineCount} />

      {toast && (
        <div className="slide fixed top-5 left-1/2 -translate-x-1/2 z-50 flex items-center gap-2 px-4 py-2.5 rounded-xl text-[14px] font-semibold text-white" style={{ background: T.ink, boxShadow: "0 12px 32px rgba(14,17,41,0.25)" }}>
          <Bell size={14} color="#F9A8D4" /> {toast}
        </div>
      )}

      <main className="flex-1 min-w-0 px-5 md:px-8 py-7 overflow-y-auto">
        <div className="max-w-5xl mx-auto">
          {view === "dashboard" && (
            <DashboardView enriched={enriched} searchFiltered={searchFiltered} jobs={visibleJobs} query={query} setQuery={setQuery} expanded={expanded} setExpanded={setExpanded} simulate={simulate} dataMode={dataMode} syncInfo={syncInfo} candidatesCount={candidates.length}  setEmailDraft={setEmailDraft}  wfApi={wfApi}  setAddJobOpen={setAddJobOpen} onBlacklist={blacklistCompany} />
          )}
          {view === "hookly" && <HooklyView candidates={candidates} />}
          {view === "candidates" && <><CandidatesView candidates={candidates} setCandidates={setCandidates} /><SheetSyncCard candidates={candidates} setCandidates={setCandidates} /><BlacklistCard blacklist={blacklist} setBlacklist={setBlacklist} /></>}
          {view === "contracten" && <ContractsView />}
          {view === "assistent" && <ChatView />}
          {view === "pipeline" && <PipelineView enriched={enriched} wfApi={wfApi} setLushaFor={setLushaFor} />}
          {view === "topmatches" && <TopMatchesView strongJobs={strongJobs} expanded={expanded} setExpanded={setExpanded} setEmailDraft={setEmailDraft} wfApi={wfApi} onBlacklist={blacklistCompany} checking={checking} onCheck={markChecking} />}
          {view === "trends" && <TrendsView jobs={enriched} />}
          {view === "signals" && <SignalsView />}
          {view === "matcher" && <MatcherView enriched={enriched} mState={matcherState} setMState={setMatcherState} />}
        </div>
      </main>
      {emailDraft && <EmailModal draft={emailDraft} onClose={() => setEmailDraft(null)} />}
      {askWho && <WhoAmIModal onPick={saveIdentity} onClose={() => setAskWho(null)} />}
      {noteFor && <NoteModal noteFor={noteFor} onSave={(t) => { if (wfApi) wfApi.setNote(noteFor.key, t); setNoteFor(null); }} onClose={() => setNoteFor(null)} />}
      {fbFor && <FeedbackModal fbFor={fbFor} onSave={(t) => { if (wfApi) wfApi.setFeedback(fbFor.key, t); setFbFor(null); }} onClose={() => setFbFor(null)} />}
      {lushaFor && <LushaModal company={lushaFor.company} domain={lushaFor.domain} onClose={() => setLushaFor(null)} />}
      {addJobOpen && <AddJobModal companies={[...new Set(allJobs.map((j) => j.company))].sort()} onAdded={(job) => { setManualJobs((p) => [job, ...p]); setAddJobOpen(false); }} onClose={() => setAddJobOpen(false)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<JobRadar />);

  </script>
</body>
</html>
