/* ─────────── LIGHTWEIGHT CHARTS (no external libs) ─────────── */
function MiniAreaChart({ data }) {
  const W = 640, H = 200, P = 28;
  const maxMon = Math.max(...data.map((d) => d.monitored)) * 1.15;
  const maxMkt = Math.max(...data.map((d) => d.market)) * 1.15;
  const x = (i) => P + (i * (W - 2 * P)) / (data.length - 1);
  const yMon = (v) => H - P - (v / maxMon) * (H - 2 * P);
  const yMkt = (v) => H - P - (v / maxMkt) * (H - 2 * P);
  const monPts = data.map((d, i) => `${x(i)},${yMon(d.monitored)}`).join(" ");
  const mktPts = data.map((d, i) => `${x(i)},${yMkt(d.market)}`).join(" ");
  const monArea = `${P},${H - P} ${monPts} ${W - P},${H - P}`;
  return (
    <svg viewBox={`0 0 ${W} ${H + 18}`} className="w-full" style={{ height: 230 }}>
      <defs>
        <linearGradient id="agrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#EC4899" stopOpacity="0.25" />
          <stop offset="100%" stopColor="#EC4899" stopOpacity="0" />
        </linearGradient>
      </defs>
      {[0.25, 0.5, 0.75, 1].map((f) => (
        <line key={f} x1={P} x2={W - P} y1={H - P - f * (H - 2 * P)} y2={H - P - f * (H - 2 * P)} stroke="#E9EAF1" strokeDasharray="3 3" />
      ))}
      <polygon points={monArea} fill="url(#agrad)" />
      <polyline points={mktPts} fill="none" stroke="#4F6BFF" strokeWidth="2" strokeDasharray="5 4" />
      <polyline points={monPts} fill="none" stroke="#EC4899" strokeWidth="2.5" strokeLinejoin="round" />
      {data.map((d, i) => <circle key={i} cx={x(i)} cy={yMon(d.monitored)} r="3" fill="#EC4899" />)}
      {data.map((d, i) => (
        <text key={i} x={x(i)} y={H + 8} textAnchor="middle" fontSize="9.5" fontWeight="600" fill="#9DA1B4">{d.week}</text>
      ))}
    </svg>
  );
}

function MiniBarChart({ data }) {
  const W = 640, H = 210, P = 26;
  const maxAbs = Math.max(...data.map((d) => Math.abs(d.change))) * 1.15;
  const zero = P + ((H - 2 * P) * maxAbs) / (2 * maxAbs) + (H - 2 * P) / 2 * 0; // midline
  const y0 = H / 2;
  const scale = (H / 2 - P) / maxAbs;
  const bw = (W - 2 * P) / data.length;
  return (
    <svg viewBox={`0 0 ${W} ${H + 14}`} className="w-full" style={{ height: 230 }}>
      <line x1={P - 8} x2={W - P + 8} y1={y0} y2={y0} stroke="#E9EAF1" />
      {data.map((d, i) => {
        const h = Math.abs(d.change) * scale;
        const bx = P + i * bw + bw * 0.18;
        const by = d.change >= 0 ? y0 - h : y0;
        return (
          <g key={d.skill}>
            <rect x={bx} y={by} width={bw * 0.64} height={h} rx="5" fill={d.change >= 0 ? "#4F6BFF" : "#F0A5C0"} />
            <text x={bx + bw * 0.32} y={d.change >= 0 ? by - 5 : by + h + 11} textAnchor="middle" fontSize="9.5" fontWeight="700"
              fill={d.change >= 0 ? "#4F6BFF" : "#DB5E8F"}>{d.change > 0 ? "+" : ""}{d.change}%</text>
            <text x={bx + bw * 0.32} y={H + 8} textAnchor="middle" fontSize="9" fontWeight="600" fill="#9DA1B4">{d.skill}</text>
          </g>
        );
      })}
    </svg>
  );
}

const AVATAR_COLORS = ["#EC4899", "#4F6BFF", "#8B5CF6", "#06B6D4", "#F59E0B", "#10B981", "#6366F1", "#F43F5E"];

function companyVisual(name) {
  let h = 0;
  for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const words = name.trim().split(/\s+/);
  const logo = (words.length > 1 ? words[0][0] + words[1][0] : name.slice(0, 2)).toUpperCase();
  return { logo, color: AVATAR_COLORS[h % AVATAR_COLORS.length] };
}

function parseCsv(text) {
  const rows = [];
  let row = [], field = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ",") { row.push(field); field = ""; }
    else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && text[i + 1] === "\n") i++;
      row.push(field); field = "";
      if (row.some((c) => c.trim() !== "")) rows.push(row);
      row = [];
    } else field += ch;
  }
  row.push(field);
  if (row.some((c) => c.trim() !== "")) rows.push(row);
  return rows;
}

function sheetRowsToCandidates(rows) {
  if (rows.length < 2) throw new Error("sheet has no data rows");
  const header = rows[0].map((h) => h.trim().toLowerCase());
  const col = (names) => header.findIndex((h) => names.some((n) => h.includes(n)));
  const iName = col(["name", "naam"]);
  const iTitle = col(["role", "title", "functie", "rol"]);
  const iYears = col(["year", "jaren", "ervaring", "experience"]);
  const iSkills = col(["skill", "tech", "stack"]);
  const iProfile = col(["profile", "digest", "history"]);
  if (iName < 0) throw new Error("no Name column found — the first row must contain column names (Name, Role, Years, Skills)");
  if (header.length < 3 || rows[0].some((h) => h.includes("\t")) || (rows[1] && String(rows[1][iName] || "").includes("\t"))) {
    throw new Error("the sheet data sits glued in one column (a paste landed inside a cell). Fix: select all → Delete, then SINGLE-click A1 (no blinking cursor) and paste again");
  }
  return rows.slice(1)
    .filter((r) => (r[iName] || "").trim())
    .map((r, i) => {
      const name = r[iName].trim();
      const v = companyVisual(name);
      return {
        id: Date.now() + i,
        name,
        title: iTitle >= 0 ? (r[iTitle] || "—").trim() : "—",
        years: iYears >= 0 ? (parseInt((String(r[iYears] || "").match(/\d+/) || ["0"])[0], 10) || 0) : 0,
        skills: iSkills >= 0 ? [...new Set(String(r[iSkills] || "").split(/[,;]+/).map((x) => normalizeSkill(x)).filter(Boolean))] : [],
        profile: iProfile >= 0 ? String(r[iProfile] || "").trim() : "",
        initials: v.logo, color: v.color,
      };
    });
}

function mapScraperJobs(data) {
  const now = Date.now();
  return data
    .filter((j) => j && j.title && j.url)
    .map((j, i) => {
      const v = companyVisual(j.company || "?");
      const fs = j.first_seen ? new Date(j.first_seen) : null;
      const isNew = fs ? (now - fs.getTime()) / 86400000 < 2 : false;
      return {
        id: `live-${i}`,
        company: j.company || "Unknown",
        logo: v.logo,
        logoColor: v.color,
        title: j.title,
        iso: j.first_seen || "",
        stack: [...new Set((j.stack || []).map(normalizeSkill))].slice(0, 6),
        exp: j.experience || "",
        url: j.url,
        ai_matches: j.ai_matches || null,
        contact: j.contact || null,
        isNew,
      };
    });
}

function normalizeSkill(raw) {
  const s = String(raw).toLowerCase().trim();
  return SKILL_SYNONYMS[s] || s;
}

const GENERIC_SKILLS = new Set(["sql", "agile", "scrum", "git", "rest", "api", "html", "css", "javascript", "jira", "confluence", "docker", "ci/cd", "linux", "unit testing"]);

// Stored pitches are name-free (public repo). The name is substituted here,
// locally in the browser: first mention gets the full name, later mentions
// the first name — reads naturally in Dutch.
function personalizePitch(text, fullName) {
  if (!text || !fullName) return text;
  const firstName = fullName.split(" ")[0];
  let first = true;
  return text.replace(/deze kandidaat/gi, (match) => {
    const name = first ? fullName : firstName;
    first = false;
    return name;
  });
}

// Builds a Dutch pitch mail to the hiring manager. The candidate stays
// anonymous (consultancy practice: name follows after mutual interest).
function buildPitchEmail(job, cand) {
  const relevant = (cand.skills || []).filter((sk) => (job.stack || []).some((js) => js.toLowerCase() === sk.toLowerCase()));
  const skills = (relevant.length >= 2 ? relevant : (cand.skills || [])).slice(0, 5);
  const skillTxt = skills.length > 1 ? skills.slice(0, -1).join(", ") + " en " + skills[skills.length - 1] : (skills[0] || "de gevraagde technologie\u00EBn");
  const subject = `Kandidaat beschikbaar voor uw vacature ${job.title}`.slice(0, 120);
  const profile = cand.profile || "";
  let recent = "";
  // cite the most recent role from the career digest, e.g.
  // "Enovates 2025-2026: embedded Java for EV chargers — ..."
  const seg = profile.split(" | ")[0] || "";
  if (seg && !/^Domains?:/i.test(seg) && !seg.includes("\t") && seg.length > 20) {
    const short = seg.length > 170 ? seg.slice(0, 167).replace(/[,;\s]+\S*$/, "") + "\u2026" : seg;
    recent = `\nTer illustratie van de meest recente ervaring: ${short}\n`;
  }
  let extra = "";
  if (job.company && job.company.length > 3 && profile.toLowerCase().includes(job.company.toLowerCase())) {
    extra = `\nInteressant detail: ${cand.name.split(" ")[0]} werkte eerder al voor ${job.company} en kent uw organisatie dus van binnenuit.\n`;
  } else {
    const dm = profile.match(/Domains?:\s*([^|]+)$/i);
    if (dm) {
      const doms = dm[1].split(",").slice(0, 2).map((x) => x.trim()).filter(Boolean);
      if (doms.length) extra = `\n${cand.name.split(" ")[0]} brengt bovendien sectorervaring mee in ${doms.join(" en ")}.\n`;
    }
  }
  const body =
`Beste,

Ik zag dat u bij ${job.company} op zoek bent naar een ${job.title} en ik vroeg me af of jullie hiervoor ook met externe consultants samenwerken.

Momenteel is onze kandidaat ${cand.name} beschikbaar en hij/zij heeft interesse in deze rol. ${cand.name.split(" ")[0]} heeft ${cand.years} jaar ervaring als ${cand.title} en sterke skills in ${skillTxt}.
${recent}${extra}
Graag stel ik deze kandidaat vrijblijvend aan u voor \u2014 zou een kort gesprek hierover mogelijk zijn?

Met vriendelijke groeten,
`;
  return { subject, body };
}

/* ─────────── AI MATCH RESOLVER (Level 3) ─────────── */
// The scraper stores matches as sheet row numbers (never names). Here we map
// rows back to the candidate list synced in THIS browser. The "check" field
// (first letter + years) detects when the sheet order changed since matching;
// on any mismatch we fall back to live keyword matching.
function resolveAiMatches(job, candidates) {
  if (!job.ai_matches || !Array.isArray(job.ai_matches) || !job.ai_matches.length) return null;
  const out = [];
  for (const m of job.ai_matches) {
    const c = candidates[m.row];
    if (!c) { console.warn("[jobradar] ai match row out of range", m.row, "candidates:", candidates.length); continue; }
    if (m.check) {
      const letter = (c.name[0] || "?").toLowerCase();
      const mYears = m.check.slice(1);
      if (m.check[0] !== letter) {
        console.warn("[jobradar] ai match name mismatch @row", m.row, "expected initial", m.check[0], "got", letter, "(sheet order changed since matching?)");
        continue;
      }
      if (c.years > 0 && mYears && String(c.years) !== mYears) {
        console.warn("[jobradar] ai match years mismatch @row", m.row, "expected", mYears, "got", c.years);
        continue;
      }
    }
    out.push({ ...c, score: Math.max(0, Math.min(100, m.score | 0)), overlap: [], reason: m.reason || "", pitch: m.pitch || null, ai: true });
  }
  return out.length ? out.slice(0, 3) : null;
}

/* ─────────── MATCHING ─────────── */
function matchCandidates(job, candidates) {
  const reqYears = parseInt(job.exp) || 0;
  const jobStack = [...new Set(job.stack.map(normalizeSkill))];
  const jobWeightTotal = jobStack.reduce((a, sk) => a + skillWeight(sk), 0) || 1;
  return candidates.map((c) => {
    const cSkills = new Set(c.skills.map(normalizeSkill));
    const overlap = jobStack.filter((sk) => cSkills.has(sk));
    const skillScore = overlap.reduce((a, sk) => a + skillWeight(sk), 0) / jobWeightTotal;
    const expScore = c.years >= reqYears ? 1 : c.years / reqYears;
    const score = Math.round((skillScore * 0.75 + expScore * 0.25) * 100);
    const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
    const reason =
      overlap.length === 0
        ? "No direct stack overlap"
        : `${overlap.slice(0, 3).map(cap).join(", ")} · ${c.years} yrs experience${c.years >= reqYears ? "" : ` (below ${job.exp})`}`;
    return { ...c, score, overlap, reason };
  }).sort((a, b) => b.score - a.score).slice(0, 3);
}

/* ─────────── DASHBOARD · daily digest ─────────── */
function formatDayLabel(iso) {
  if (!iso) return "Date unknown";
  const d = new Date(iso + "T00:00:00");
  if (isNaN(d)) return iso;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((today - d) / 86400000);
  const nice = d.toLocaleDateString("nl-BE", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  if (diff === 0) return `Vandaag · ${nice}`;
  if (diff === 1) return `Gisteren · ${nice}`;
  return nice;
}

function AddJobModal({ companies, onAdded, onClose }) {
  const [company, setCompany] = useState("");
  const [title, setTitle] = useState("");
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const [file, setFile] = useState(null);
  const pickFile = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    if (f.size > 8 * 1024 * 1024) { setError("Bestand te groot (max 8 MB)."); return; }
    const rd = new FileReader();
    rd.onload = () => setFile({ name: f.name, type: f.type, data: String(rd.result).split(",")[1] });
    rd.readAsDataURL(f);
  };
  const submit = () => {
    if (!company.trim() || !title.trim() || !text.trim()) { setError("Vul bedrijf, titel én vacaturetekst in."); return; }
    setBusy(true); setError("");
    fetch("/api/manual", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ company: company.trim(), title: title.trim(), text, fileName: file?.name, fileType: file?.type, fileData: file?.data }) })
      .then(async (r) => { const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || `fout ${r.status}`); onAdded(d); })
      .catch((e) => { setError(String(e.message || e)); setBusy(false); });
  };
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(15,17,26,0.45)" }} onClick={busy ? undefined : onClose}>
      <div className="w-full max-w-lg rounded-2xl p-5" style={{ background: "#fff", boxShadow: "0 24px 60px rgba(15,17,26,0.25)" }} onClick={(e) => e.stopPropagation()}>
        <div className="text-[15.5px] font-bold tracking-tight mb-1">📥 Klantopdracht toevoegen</div>
        <p className="text-[13px] font-medium mb-4" style={{ color: T.sub }}>Voor vacatures die je rechtstreeks van klanten krijgt en niet online staan. De AI matcht meteen tegen de volledige CV-database.</p>

        <input list="jr-companies" value={company} onChange={(e) => setCompany(e.target.value)} placeholder="Bv. Mediahuis" className="w-full mt-1 mb-3 px-3 h-9 rounded-[10px] text-[13.5px] font-medium outline-none" style={{ background: "#F4F5F9", border: `1px solid ${T.line}` }} />
        <datalist id="jr-companies">{companies.map((c) => <option key={c} value={c} />)}</datalist>
        <label className="text-[12px] font-bold uppercase tracking-wider" style={{ color: T.faint }}>Functietitel</label>
        <input value={title} onChange={(e) => setTitle(e.target.value)} placeholder="Bv. Freelance Security Project Manager" className="w-full mt-1 mb-3 px-3 h-9 rounded-[10px] text-[13.5px] font-medium outline-none" style={{ background: "#F4F5F9", border: `1px solid ${T.line}` }} />
        <label className="text-[12px] font-bold uppercase tracking-wider" style={{ color: T.faint }}>Vacaturetekst</label>
        <textarea value={text} onChange={(e) => setText(e.target.value)} rows={8} placeholder="Plak hier de volledige vacaturetekst of de mail van de klant…" className="w-full mt-1 px-3 py-2.5 rounded-[10px] text-[13px] font-medium leading-relaxed outline-none resize-y" style={{ background: "#F4F5F9", border: `1px solid ${T.line}` }} />
        <label className="text-[12px] font-bold uppercase tracking-wider block mt-3" style={{ color: T.faint }}>Vacaturedocument (optioneel)</label>
        {file ? (
          <p className="text-[13px] font-semibold mt-1 flex items-center gap-2">📄 {file.name}
            <span role="button" onClick={() => setFile(null)} className="cursor-pointer text-[12px] font-bold" style={{ color: T.faint }}>× verwijderen</span></p>
        ) : (
          <input type="file" accept=".pdf,.doc,.docx,.txt" onChange={pickFile} className="mt-1 text-[12.5px]" />
        )}
        {error && <p className="text-[12.5px] font-semibold mt-2" style={{ color: "#B91C1C" }}>{error}</p>}
        <div className="flex items-center justify-end gap-2 mt-4">
          <button onClick={onClose} disabled={busy} className="text-[13.5px] font-semibold px-4 h-9 rounded-[10px] disabled:opacity-50" style={{ background: "#F1F2F7", color: T.sub }}>Annuleren</button>
          <button onClick={submit} disabled={busy} className="text-[13.5px] font-semibold px-4 h-9 rounded-[10px] text-white transition-opacity hover:opacity-90 disabled:opacity-60" style={{ background: T.grad }}>
            {busy ? "AI matcht… (±20 sec)" : "Toevoegen & matchen"}
          </button>
        </div>
      </div>
    </div>
  );
}

function LushaModal({ company, domain, onClose }) {
  const [state, setState] = useState({ loading: true, error: null, contacts: [], cached: false, via: "", debug: "" });
  const [copied, setCopied] = useState("");
  useEffect(() => {
    fetch("/api/lusha", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ company, domain }) })
      .then(async (r) => {
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error || `fout ${r.status}`);
        setState({ loading: false, error: null, contacts: d.contacts || [], cached: !!d.cached, via: d.via || "", debug: d.debug || "" });
      })
      .catch((e) => setState({ loading: false, error: String(e.message || e), contacts: [], cached: false }));
  }, [company]);
  const copy = (text) => {
    navigator.clipboard.writeText(text).then(() => { setCopied(text); setTimeout(() => setCopied(""), 1500); });
  };
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(15,17,26,0.45)" }} onClick={onClose}>
      <div className="w-full max-w-md rounded-2xl p-5" style={{ background: "#fff", boxShadow: "0 24px 60px rgba(15,17,26,0.25)" }} onClick={(e) => e.stopPropagation()}>
        <div className="text-[15.5px] font-bold tracking-tight mb-1">🔍 Hiring managers bij {company}</div>
        {state.loading && <p className="text-[13.5px] font-medium py-6 text-center" style={{ color: T.sub }}>Zoeken via Lusha…</p>}
        {state.error && (
          <div className="text-[13px] font-medium mt-2 px-3 py-2.5 rounded-[10px]" style={{ background: "rgba(239,68,68,0.07)", color: "#B91C1C", border: "1px solid rgba(239,68,68,0.2)" }}>
            {state.error}
          </div>
        )}
        {!state.loading && !state.error && state.contacts.length === 0 && (
          <p className="text-[13.5px] font-medium py-6 text-center" style={{ color: T.sub }}>Geen contacten gevonden voor dit bedrijf.</p>
        )}
        {state.contacts.length > 0 && (
          <div className="flex flex-col gap-2 mt-3">
            {state.contacts.map((c, i) => (
              <div key={i} className="rounded-[12px] p-3" style={{ background: "#FAFBFE", border: `1px solid ${T.line}` }}>
                <div className="text-[13.5px] font-bold">{c.name}</div>
                {c.title && <div className="text-[12.5px] font-semibold mt-0.5" style={{ color: T.sub }}>{c.title}</div>}
                <div className="flex flex-col gap-1 mt-1.5">
                  {c.email && (
                    <div className="flex items-center justify-between gap-2">
                      <span className="text-[12.5px] font-medium truncate" style={{ color: T.blue }}>{c.email}</span>
                      <button onClick={() => copy(c.email)} className="text-[11px] font-bold px-2 py-0.5 rounded-md shrink-0" style={{ background: T.blueSoft, color: T.blue }}>{copied === c.email ? "✓" : "Kopieer"}</button>
                    </div>
                  )}
                  {c.phone && (
                    <div className="flex items-center justify-between gap-2">
                      <span className="text-[12.5px] font-medium" style={{ color: T.sub }}>{c.phone}</span>
                      <button onClick={() => copy(c.phone)} className="text-[11px] font-bold px-2 py-0.5 rounded-md shrink-0" style={{ background: "#F1F2F7", color: T.sub }}>{copied === c.phone ? "✓" : "Kopieer"}</button>
                    </div>
                  )}
                  {!c.email && !c.phone && <span className="text-[12px] font-medium" style={{ color: T.faint }}>Geen contactgegevens vrijgegeven</span>}
                </div>
              </div>
            ))}
          </div>
        )}
        {state.debug && (
          <div className="mt-3 px-2.5 py-2 rounded-[9px] text-[10.5px] leading-snug break-all" style={{ background: "#F4F5F9", color: T.sub, border: `1px solid ${T.line}`, fontFamily: "monospace" }}>

          </div>
        )}
        <p className="text-[11.5px] font-medium mt-3" style={{ color: T.faint }}>
          Via jullie Lusha-account{state.via ? ` · gezocht op ${state.via}` : ""}{state.cached ? " · uit cache (geen credits verbruikt)" : " · verbruikt Lusha-credits"} · resultaten 30 dagen bewaard
        </p>
      </div>
    </div>
  );
}

  const greet = (text) => contact.name ? text.replace(/^Beste,/, `Beste ${contact.name.split(" ")[0]},`) : text;
  const [to, setTo] = useState(contact.email || "");
  const [subject, setSubject] = useState(initial.subject);
  const [body, setBody] = useState(greet(cand.pitch ? personalizePitch(cand.pitch, cand.name) + "\n" : initial.body));
  const [copied, setCopied] = useState(false);

  const copyAll = async () => {
    try {
      await navigator.clipboard.writeText(`Onderwerp: ${subject}\n\n${body}`);
      setCopied(true);
      setTimeout(() => setCopied(false), 1800);
    } catch (e) {}
  };
  const mailto = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(15,17,26,0.45)" }} onClick={onClose}>

          <div>
            <div className="text-[15.5px] font-bold tracking-tight flex items-center gap-2"><Mail size={15} color={T.pink} /> Pitch-e-mail</div>
            <div className="text-[12.5px] font-medium mt-0.5" style={{ color: T.sub }}>{cand.name} → {job.company} · {job.title}</div>
          </div>
          <button onClick={onClose} className="text-[20px] font-bold px-2 rounded-lg hover:opacity-60" style={{ color: T.faint }}>×</button>
        </div>
        <div className="p-5">
          <label className="text-[12px] font-bold uppercase tracking-wider" style={{ color: T.faint }}>Aan</label>
          <input value={to} onChange={(e) => setTo(e.target.value)} placeholder="e-mail hiring manager (niet gevonden op de vacaturepagina)" className="w-full mt-1 mb-3 px-3 h-9 rounded-[10px] text-[13.5px] font-medium outline-none" style={{ background: "#F4F5F9", border: `1px solid ${T.line}` }} />
          {contact.name && <p className="text-[12px] font-semibold -mt-2 mb-2" style={{ color: T.green }}>Contactpersoon gevonden op de vacaturepagina: {contact.name}{contact.email ? ` · ${contact.email}` : ""}</p>}
          <label className="text-[12px] font-bold uppercase tracking-wider" style={{ color: T.faint }}>Onderwerp</label>
          <input value={subject} onChange={(e) => setSubject(e.target.value)} className="w-full mt-1 mb-3 px-3 h-9 rounded-[10px] text-[13.5px] font-medium outline-none" style={{ background: "#F4F5F9", border: `1px solid ${T.line}` }} />
          <label className="text-[12px] font-bold uppercase tracking-wider" style={{ color: T.faint }}>Bericht</label>
          <textarea value={body} onChange={(e) => setBody(e.target.value)} rows={11} className="w-full mt-1 px-3 py-2.5 rounded-[10px] text-[13.5px] font-medium leading-relaxed outline-none resize-y" style={{ background: "#F4F5F9", border: `1px solid ${T.line}` }} />
          <p className="text-[12px] font-medium mt-2" style={{ color: T.faint }}>De naam wordt lokaal ingevuld en staat nooit in de publieke data. Check zoals afgesproken eerst even met de kandidaat vóór verzenden.</p>
          <div className="flex items-center gap-2 mt-4">
            <button onClick={copyAll} className="flex items-center gap-1.5 text-[13.5px] font-semibold px-4 h-9 rounded-[10px] text-white transition-opacity hover:opacity-90" style={{ background: T.grad }}>
              {copied ? "Gekopieerd ✓" : "Kopieer"}
            </button>
            <a href={mailto} className="flex items-center gap-1.5 text-[13.5px] font-semibold px-4 h-9 rounded-[10px] transition-opacity hover:opacity-80" style={{ background: T.blueSoft, color: T.blue }}>
              Open in mailprogramma
            </a>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ─────────── HIRING TRENDS ─────────── */
function TrendsView({ jobs }) {
  const now = new Date();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const monthName = now.toLocaleDateString("nl-BE", { month: "long", year: "numeric" });

  const dated = jobs.filter((j) => j.iso);

  // Detect the baseline day: when the scraper memory was (re)built, every existing
  // vacancy got "first seen" on that one day. Counting those as "new" would poison
  // every trend, so if a single day holds >40% of all jobs we exclude it from
  // newness metrics (it still counts toward totals).
  const byDay = {};
  dated.forEach((j) => { const d = j.iso.slice(0, 10); byDay[d] = (byDay[d] || 0) + 1; });
  const days = Object.keys(byDay).sort();
  let baselineDay = null;
  days.forEach((d) => { if (byDay[d] > dated.length * 0.4) baselineDay = d; });

  const isRealNew = (j) => j.iso && j.iso.slice(0, 10) !== baselineDay;

  const monthJobs = dated.filter((j) => isRealNew(j) && new Date(j.iso) >= monthStart);
  const totalJobs = jobs.length;

  // stack demand across all open vacancies
  const stackCounts = {};
  jobs.forEach((j) => (j.stack || []).forEach((sk) => { stackCounts[sk] = (stackCounts[sk] || 0) + 1; }));
  const topStack = Object.entries(stackCounts).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const hottest = topStack[0];

  // daily new jobs, last 14 days (baseline excluded)
  const daily = [];
  for (let i = 13; i >= 0; i--) {
    const d = new Date(now); d.setDate(now.getDate() - i);
    const key = d.toISOString().slice(0, 10);
    daily.push({
      label: d.toLocaleDateString("nl-BE", { day: "numeric", month: "short" }).replace(" ", " "),
      count: key === baselineDay ? 0 : (byDay[key] || 0),
      weekend: d.getDay() === 0 || d.getDay() === 6,
    });
  }

  // growth signals: companies with real momentum (baseline excluded)
  const last30 = new Date(now); last30.setDate(now.getDate() - 30);
  const prev30 = new Date(now); prev30.setDate(now.getDate() - 60);
  const perCompany = {};
  dated.forEach((j) => {
    if (!isRealNew(j)) return;
    const d = new Date(j.iso);
    const c = (perCompany[j.company] = perCompany[j.company] || { recent: 0, prev: 0, titles: [] });
    if (d >= last30) { c.recent += 1; if (c.titles.length < 3) c.titles.push(j.title); }
    else if (d >= prev30) c.prev += 1;
  });
  const signals = Object.entries(perCompany)
    .map(([company, v]) => ({ company, ...v, open: jobs.filter((j) => j.company === company).length }))
    .filter((c) => c.recent >= 2 && c.recent >= c.prev)
    .sort((a, b) => b.recent - a.recent)
    .slice(0, 10);

  // stale vacancies: open 60+ days (needs first_seen history; baseline-day jobs
  // have unknown real age, so they only qualify via genuinely old first_seen)
  const STALE_DAYS = 60;
  const stale = dated
    .map((j) => ({ ...j, age: Math.floor((now - new Date(j.iso)) / 86400000) }))
    .filter((j) => j.age >= STALE_DAYS && j.iso.slice(0, 10) !== baselineDay)
    .sort((a, b) => b.age - a.age)
    .slice(0, 12);

  const CW = 640, CH = 200, CP = 30;

  return (
    <>
      <PageHeader
        title="Markttrends"
        subtitle="Live berekend uit je gescande vacatures — trends worden scherper naarmate de scanhistoriek groeit"
      />

      {/* headline stats */}
      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
        <Stat icon={BarChart3} label={`Nieuwe IT-jobs · ${monthName}`} value={monthJobs.length} tint="blue" />
        <Stat icon={Flame} label="Meest gevraagde skill" value={hottest ? hottest[0] : "—"} tint="pink" extra={hottest && <span className="text-[13px] font-bold" style={{ color: T.pink }}>{hottest[1]} vacatures</span>} />
        <Stat icon={Briefcase} label="Totaal open IT-jobs" value={totalJobs} tint="blue" />
      </div>

      <div className="grid grid-cols-1 xl:grid-cols-2 gap-5 mb-5">
        {/* new jobs per day */}
        <div style={cardStyle} className="p-5">
          <div className="mb-3">
            <h3 className="text-[16px] font-bold tracking-tight">Nieuwe IT-jobs per dag</h3>
            <p className="text-[13.5px] font-medium mt-0.5" style={{ color: T.sub }}>Laatste 14 dagen{baselineDay ? " · eerste-scan-basisdag uitgesloten" : ""} · weekends niet gescand</p>
          </div>
          <svg viewBox={`0 0 ${CW} ${CH + 16}`} className="w-full" style={{ height: 220 }}>
            {(() => {
              const maxV = Math.max(1, ...daily.map((d) => d.count));
              const bw = (CW - 2 * CP) / daily.length;
              return daily.map((d, i) => {
                const h = (d.count / maxV) * (CH - 2 * CP);
                const bx = CP + i * bw + bw * 0.16;
                const by = CH - CP - h;
                return (
                  <g key={i}>
                    <rect x={bx} y={by} width={bw * 0.68} height={Math.max(h, 2)} rx="5" fill={d.count === 0 ? "#EEF0F6" : "url(#tgrad)"} />
                    {d.count > 0 && <text x={bx + bw * 0.34} y={by - 6} textAnchor="middle" fontSize="11" fontWeight="700" fill="#4F6BFF">{d.count}</text>}
                    <text x={bx + bw * 0.34} y={CH - CP + 14} textAnchor="middle" fontSize="8.5" fontWeight="600" fill="#9DA1B4" transform={`rotate(-38 ${bx + bw * 0.34} ${CH - CP + 14})`}>{d.label}</text>
                  </g>
                );
              });
            })()}
            <defs>
              <linearGradient id="tgrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor="#EC4899" /><stop offset="100%" stopColor="#4F6BFF" />
              </linearGradient>
            </defs>
          </svg>
        </div>

        {/* tech stack demand */}
        <div style={cardStyle} className="p-5">
          <div className="mb-3">
            <h3 className="text-[16px] font-bold tracking-tight">Vraag naar technologieën</h3>
            <p className="text-[13.5px] font-medium mt-0.5" style={{ color: T.sub }}>Vermeldingen in alle {totalJobs} open vacatures</p>
          </div>
          <div className="flex flex-col gap-2.5 pt-1">
            {topStack.map(([sk, n]) => (
              <div key={sk} className="flex items-center gap-3">
                <span className="text-[13px] font-bold w-24 truncate text-right" style={{ color: T.sub }}>{sk}</span>
                <div className="flex-1 h-[18px] rounded-full overflow-hidden" style={{ background: "#EEF0F6" }}>
                  <div className="h-full rounded-full" style={{ width: `${(n / topStack[0][1]) * 100}%`, background: T.grad, minWidth: 20 }} />
                </div>
                <span className="text-[14px] font-bold tabular-nums w-8">{n}</span>
              </div>
            ))}
            {topStack.length === 0 && <p className="text-[13.5px] font-medium py-6 text-center" style={{ color: T.faint }}>Nog geen stackdata — verschijnt na de eerste scan</p>}
          </div>
        </div>
      </div>

      {/* growth signals */}
      <div style={cardStyle} className="overflow-hidden">
        <div className="px-5 pt-5 pb-4" style={{ borderBottom: `1px solid ${T.line}` }}>
          <div className="flex items-center gap-2">
            <TrendingUp size={17} color={T.pink} />
            <h3 className="text-[16px] font-bold tracking-tight">Groeisignalen</h3>
          </div>
          <p className="text-[13.5px] font-medium mt-0.5" style={{ color: T.sub }}>
            Bedrijven die de laatste 30 dagen meerdere nieuwe IT-vacatures plaatsten — groeiende teams betekenen meestal budget, projecten en openheid voor externe hulp. <span className="font-bold" style={{ color: T.ink }}>Warme deuren voor sales.</span>
          </p>
        </div>
        {signals.map((c, i) => (
          <div key={c.company} className="row-hover flex items-center gap-4 px-5 py-3.5 flex-wrap" style={{ borderBottom: i < signals.length - 1 ? `1px solid ${T.line}` : "none" }}>
            <div className="min-w-[180px]">
              <div className="text-[14.5px] font-bold tracking-tight flex items-center gap-1.5">
                {c.company}
                {c.prev === 0 && c.recent >= 3 && <span className="inline-flex items-center gap-0.5 text-[11px] font-bold px-1.5 py-[1px] rounded-md" style={{ background: T.pinkSoft, color: T.pink }}><Flame size={10} /> Surge</span>}
              </div>
              <div className="text-[12.5px] font-medium" style={{ color: T.faint }}>{c.open} open IT-rollen in totaal</div>
            </div>
            <span className="text-[13.5px] font-bold px-2.5 py-1 rounded-lg" style={{ background: T.blueSoft, color: T.blue }}>+{c.recent} in 30 dagen</span>
            <span className="text-[13px] font-medium flex-1 min-w-[200px] truncate" style={{ color: T.sub }}>{c.titles.join(" · ")}</span>
          </div>
        ))}
        {signals.length === 0 && (
          <div className="px-5 py-10 text-center">
            <p className="text-[14.5px] font-semibold" style={{ color: T.sub }}>Nog geen groeisignalen</p>
            <p className="text-[13.5px] font-medium mt-1" style={{ color: T.faint }}>Signalen verschijnen zodra bedrijven 2+ echt nieuwe vacatures plaatsen binnen 30 dagen — geef de dagelijkse scans een week of twee om historiek op te bouwen</p>
          </div>
        )}
      </div>

      {/* stale vacancies */}
      <div style={cardStyle} className="overflow-hidden mt-5">
        <div className="px-5 pt-5 pb-4" style={{ borderBottom: `1px solid ${T.line}` }}>
          <div className="flex items-center gap-2">
            <Clock size={17} color={T.blue} />
            <h3 className="text-[16px] font-bold tracking-tight">Moeilijk in te vullen vacatures</h3>
          </div>
          <p className="text-[13.5px] font-medium mt-0.5" style={{ color: T.sub }}>
            Al {"≥"}60 dagen open — deze bedrijven vinden dit profiel zelf niet. <span className="font-bold" style={{ color: T.ink }}>Heb jij een passend CV, dan is dit je sterkste openingszin.</span>
          </p>
        </div>
        {stale.map((j, i) => (
          <div key={j.id} className="row-hover flex items-center gap-4 px-5 py-3.5 flex-wrap" style={{ borderBottom: i < stale.length - 1 ? `1px solid ${T.line}` : "none" }}>
            <div className="min-w-[220px] flex-1">
              <div className="text-[14.5px] font-bold tracking-tight truncate">{j.title}</div>
              <div className="text-[12.5px] font-medium" style={{ color: T.faint }}>{j.company}</div>
            </div>
            <span className="text-[13.5px] font-bold px-2.5 py-1 rounded-lg tabular-nums" style={{ background: j.age >= 90 ? T.pinkSoft : T.blueSoft, color: j.age >= 90 ? T.pink : T.blue }}>{j.age} dagen open</span>
            {j.matches && j.matches[0] && j.matches[0].score >= 60 && (
              <span className="inline-flex items-center gap-1 text-[12.5px] font-bold px-2 py-1 rounded-lg" style={{ background: "rgba(16,185,129,0.10)", color: T.green }}><Sparkles size={11} /> Jij hebt een {j.matches[0].score}% match</span>
            )}
            <a href={j.url} target="_blank" rel="noreferrer" className="text-[13px] font-semibold flex items-center gap-1 hover:underline" style={{ color: T.blue }}>Bekijk <ExternalLink size={11} /></a>
          </div>
        ))}
        {stale.length === 0 && (
          <div className="px-5 py-10 text-center">
            <p className="text-[14.5px] font-semibold" style={{ color: T.sub }}>Nog geen langdurig openstaande vacatures</p>
            <p className="text-[13.5px] font-medium mt-1" style={{ color: T.faint }}>Vacatures verschijnen hier zodra ze 60+ dagen open staan in de scanhistoriek — deze lijst vult zichzelf naarmate de opvolging doorloopt</p>
          </div>
        )}
      </div>
    </>
  );
}

/* ─────────── HOOKLY ─────────── */
const HK_SECTIONS = {
  "profiel": { icon: "👤", color: "#4F6BFF" },
  "persoonlijke interesses": { icon: "🎯", color: "#EC4899" },
  "gespreksopeners": { icon: "💬", color: "#10B981" },
  "social media": { icon: "📱", color: "#8B5CF6" },
  "bronnen": { icon: "🔗", color: "#64748B" },
};

function mdInline(t) {
  return String(t).split(/\*\*(.+?)\*\*/g).map((part, i) =>
    i % 2 === 1 ? <strong key={i} className="font-bold">{part}</strong> : <span key={i}>{linkify(part)}</span>);
}

function Dossier({ text }) {
  const [copied, setCopied] = useState("");
  const copy = (t) => navigator.clipboard.writeText(t).then(() => { setCopied(t); setTimeout(() => setCopied(""), 1500); });
  const sections = [];
  let cur = { title: "", lines: [] };
  let raw = String(text).split("\n").filter((ln) => !/^\s*[-–—=]{2,}\s*$/.test(ln));
  const firstSec = raw.findIndex((ln) => ln.startsWith("## "));
  if (firstSec > 0) raw = raw.slice(firstSec);   // alles vóór de eerste sectie = AI-preambule
  raw.forEach((ln) => {
    if (ln.startsWith("## ")) { if (cur.title || cur.lines.length) sections.push(cur); cur = { title: ln.slice(3).trim(), lines: [] }; }
    else cur.lines.push(ln);
  });
  if (cur.title || cur.lines.length) sections.push(cur);
  return (
    <div className="flex flex-col gap-4">
      {sections.map((sec, si) => {
        const cfg = Object.entries(HK_SECTIONS).find(([k]) => sec.title.toLowerCase().includes(k))?.[1] || { icon: "📄", color: T.sub };
        const isOpeners = sec.title.toLowerCase().includes("gespreksopener");
        const isSources = sec.title.toLowerCase().includes("bronnen");
        const body = sec.lines.join("\n").trim();
        const items = sec.lines.map((l) => l.trim()).filter(Boolean);
        return (
          <div key={si} className="rounded-[14px] p-4" style={{ background: "#FAFBFE", border: `1px solid ${T.line}`, borderLeft: `3px solid ${cfg.color}` }}>
            {sec.title && (
              <div className="flex items-center gap-2 mb-2.5">
                <span className="text-[16px]">{cfg.icon}</span>
                <span className="text-[13px] font-extrabold uppercase tracking-wider" style={{ color: cfg.color }}>{sec.title}</span>
              </div>
            )}
            {isOpeners ? (
              <div className="flex flex-col gap-2">
                {items.filter((l) => /^\d+[\.\)]/.test(l)).map((l, i) => {
                  const t = l.replace(/^\d+[\.\)]\s*/, "").replace(/\*\*/g, "").replace(/^["']|["']$/g, "");
                  return (
                    <div key={i} className="flex items-start justify-between gap-3 rounded-[10px] px-3 py-2.5" style={{ background: "#fff", border: `1px solid ${T.line}` }}>
                      <p className="text-[13.5px] font-medium leading-relaxed">"{t}"</p>
                      <button onClick={() => copy(t)} className="shrink-0 text-[11px] font-bold px-2 py-1 rounded-md" style={{ background: "rgba(16,185,129,0.10)", color: T.green }}>{copied === t ? "✓" : "Kopieer"}</button>
                    </div>
                  );
                })}
              </div>
            ) : isSources ? (
              <div className="flex flex-wrap gap-1.5">
                {(body.match(/https?:\/\/[^\s)\]]+/g) || []).map((u, i) => (
                  <a key={i} href={u} target="_blank" rel="noreferrer" className="text-[11.5px] font-bold px-2 py-1 rounded-md hover:opacity-75 break-all" style={{ background: T.blueSoft, color: T.blue }}>{u.replace(/^https?:\/\/(www\.)?/, "").slice(0, 40)}{u.length > 48 ? "…" : ""}</a>
                ))}
              </div>
            ) : (
              <div className="flex flex-col gap-1.5">
                {items.map((l, i) => {
                  const isBullet = /^[-•*]\s/.test(l);
                  const t = l.replace(/^[-•*]\s*/, "");
                  return (
                    <p key={i} className="text-[13.5px] font-medium leading-relaxed flex gap-2">
                      {isBullet && <span style={{ color: cfg.color }}>•</span>}
                      <span className="whitespace-pre-wrap">{mdInline(t)}</span>
                    </p>
                  );
                })}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function CandidatesView({ candidates, setCandidates }) {
  const [sheetUrl, setSheetUrl] = useState(() => { try { return localStorage.getItem("jobradar-sheet-url") || ""; } catch (e) { return ""; } });
  const [sheetBusy, setSheetBusy] = useState(false);
  const [sheetInfo, setSheetInfo] = useState(null);

  const syncSheet = async () => {
    if (!sheetUrl) return;
    setSheetBusy(true); setSheetInfo(null);
    try {
      const r = await fetch(sheetUrl);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const text = await r.text();
      if (text.trim().startsWith("<")) throw new Error("that link returns a web page, not CSV — use File → Share → Publish to web and pick CSV");
      const mapped = sheetRowsToCandidates(parseCsv(text));
      if (!mapped.length) throw new Error("no candidate rows found");
      setCandidates(mapped);
      try { localStorage.setItem("jobradar-sheet-url", sheetUrl); } catch (e) {}
      setSheetInfo({ count: mapped.length, time: new Date().toLocaleTimeString("nl-BE", { hour: "2-digit", minute: "2-digit" }) });
    } catch (e) {
      setSheetInfo({ error: e.message });
    } finally {
      setSheetBusy(false);
    }
  };

  return (
    <>
      <PageHeader
        title="CV-database"
        subtitle="Beheerd in jullie Google Sheet — elke vacature wordt 's ochtends AI-gematcht tegen deze lijst"
      />

      {/* count */}
      <div style={cardStyle} className="p-5 mb-5 flex items-center gap-4">
        <div className="flex items-center justify-center w-12 h-12 rounded-[14px]" style={{ background: "rgba(236,72,153,0.10)" }}>
          <Users size={22} color={T.pink} />
        </div>
        <div>
          <div className="text-[23px] font-extrabold tracking-tight leading-none">{candidates.length}</div>
          <div className="text-[13px] font-semibold mt-1" style={{ color: T.sub }}>CV's in je database</div>
        </div>
      </div>

      {/* google sheet sync */}
      <div style={cardStyle} className="p-4 mb-5">
        <div className="flex items-center gap-2 mb-1">
          <RefreshCw size={14} color={T.blue} />
          <span className="text-[14.5px] font-bold tracking-tight">Synchroniseer vanuit Google Sheet</span>
        </div>
        <p className="text-[13px] font-medium mb-3" style={{ color: T.sub }}>
          Kandidaten leven in jullie Google Sheet met kolommen <span className="font-bold">Name, Role, Years, Skills, Profile</span>. Pas de Sheet aan en klik daarna hier op <span className="font-bold">Sync</span>. De link wordt enkel in deze browser onthouden — kandidaatgegevens verlaten je toestel nooit.
        </p>
        <div className="flex items-center gap-2 flex-wrap">
          <div className="flex items-center gap-2 px-3 h-9 rounded-[10px] flex-1 min-w-[240px]" style={{ background: "#F4F5F9", border: `1px solid ${T.line}` }}>
            <Link2 size={14} color={T.faint} />
            <input value={sheetUrl} onChange={(e) => setSheetUrl(e.target.value)} placeholder="https://docs.google.com/spreadsheets/d/e/…/pub?output=csv" className="outline-none text-[13.5px] font-medium w-full bg-transparent" />
          </div>
          <button onClick={syncSheet} disabled={sheetBusy || !sheetUrl} className="flex items-center gap-1.5 text-[14px] font-semibold px-4 h-9 rounded-[10px] text-white transition-opacity hover:opacity-90 disabled:opacity-50" style={{ background: T.grad }}>
            <RefreshCw size={13} className={sheetBusy ? "spin" : ""} /> {sheetBusy ? "Bezig…" : "Sync"}
          </button>
        </div>
        {sheetInfo && sheetInfo.error && (
          <p className="text-[13px] font-semibold mt-2.5" style={{ color: T.red }}>Sync mislukt: {sheetInfo.error}</p>
        )}
        {sheetInfo && sheetInfo.count != null && (
          <p className="text-[13px] font-semibold mt-2.5" style={{ color: T.green }}>{sheetInfo.count} kandidaten gesynchroniseerd om {sheetInfo.time}.</p>
        )}

    </>
  );
}

function HooklyView({ candidates }) {
  const [name, setName] = useState("");
  const [company, setCompany] = useState("");
  const [linkedin, setLinkedin] = useState("");
  const [busy, setBusy] = useState(false);
  const [res, setRes] = useState(null);
  const [error, setError] = useState("");

  const [matchCand, setMatchCand] = useState("");
  const [match, setMatch] = useState(null);
  const [matchBusy, setMatchBusy] = useState(false);
  const runMatch = () => {
    if (!matchCand || matchBusy || !res) return;
    setMatchBusy(true); setMatch(null);
    fetch("/api/hookly", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action: "match", name: res.name, company: res.company, candName: matchCand }) })
      .then(async (r) => { const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || `fout ${r.status}`); setMatch(d); })
      .catch((e) => setError(String(e.message || e)))
      .finally(() => setMatchBusy(false));
  };
  useEffect(() => { fetch("/api/hookly").then((r) => (r.ok ? r.json() : {})).then((d) => setRecent(d.recent || [])).catch(() => {}); }, [busy]);
  const run = (n, c, force) => {
    if (!n.trim() || !c.trim() || busy) { if (!busy) setError("Vul naam én bedrijf in."); return; }
    setBusy(true); setError(""); setRes(null);
    fetch("/api/hookly", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name: n.trim(), company: c.trim(), linkedin: linkedin.trim(), force }) })
      .then(async (r) => { const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || `fout ${r.status}`); setRes(d); setName(d.name); setCompany(d.company); setMatch(null); setMatchCand(""); })
      .catch((e) => setError(String(e.message || e)))
      .finally(() => setBusy(false));
  };
  return (
    <>
      <PageHeader title="Hookly" subtitle="Persoonlijke raakvlakken met hiring managers — van cold call naar warm gesprek" />
      <div style={cardStyle} className="p-4 mb-4">
        <div className="grid grid-cols-1 md:grid-cols-3 gap-2">
          <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Naam (bv. Bart Lowagie)" className="px-3 h-10 rounded-[10px] text-[13.5px] font-medium outline-none" style={{ background: "#F4F5F9", border: `1px solid ${T.line}` }} />
          <input value={company} onChange={(e) => setCompany(e.target.value)} placeholder="Bedrijf (bv. Picanol)" className="px-3 h-10 rounded-[10px] text-[13.5px] font-medium outline-none" style={{ background: "#F4F5F9", border: `1px solid ${T.line}` }} />
          <input value={linkedin} onChange={(e) => setLinkedin(e.target.value)} placeholder="LinkedIn-URL (optioneel)" className="px-3 h-10 rounded-[10px] text-[13.5px] font-medium outline-none" style={{ background: "#F4F5F9", border: `1px solid ${T.line}` }} />
        </div>
        <div className="flex items-center gap-3 mt-3">
          <button onClick={() => run(name, company, false)} disabled={busy} className="text-[13.5px] font-bold px-4 h-10 rounded-[10px] text-white transition-opacity hover:opacity-90 disabled:opacity-60" style={{ background: T.grad }}>
            {busy ? "Onderzoekt… (±1 min)" : "🔎 Start onderzoek"}
          </button>
          {res?.cached && <button onClick={() => run(name, company, true)} className="text-[12.5px] font-bold" style={{ color: T.blue }}>↻ Vernieuw onderzoek</button>}
          {error && <span className="text-[12.5px] font-semibold" style={{ color: "#B91C1C" }}>{error}</span>}
        </div>
        {recent.length > 0 && (
          <div className="flex flex-wrap gap-1.5 mt-3">
            {recent.slice(0, 10).map((r) => (
              <button key={r.name + r.company} onClick={() => { setName(r.name); setCompany(r.company); run(r.name, r.company, false); }} className="text-[11.5px] font-bold px-2 py-1 rounded-md hover:opacity-75" style={{ background: "#F1F2F7", color: T.sub }}>{r.name} · {r.company}</button>
            ))}
          </div>

      </div>
      {busy && <div style={cardStyle} className="p-8 text-center text-[13.5px] font-medium"><span style={{ color: T.faint }}>Hookly doorzoekt het web — podcasts, sportuitslagen, talks, publicaties…</span></div>}
      {res && !busy && (
        <div style={cardStyle} className="p-5">
          <div className="flex items-center justify-between mb-2 flex-wrap gap-2">

            <div className="flex items-center gap-2">
              <select value={matchCand} onChange={(e) => setMatchCand(e.target.value)} className="text-[12.5px] font-semibold px-2 h-8 rounded-[8px] outline-none" style={{ background: "#F4F5F9", border: `1px solid ${T.line}`, maxWidth: "180px" }}>
                <option value="">Kies kandidaat…</option>

            </div>
            <span className="text-[11.5px] font-medium" style={{ color: T.faint }}>{res.cached ? "uit teamcache" : "vers onderzoek"} · {new Date(res.at).toLocaleDateString("nl-BE")}</span>
          </div>
          <Dossier text={res.dossier} />
          {match && !matchBusy && (
            <div className="mt-4 pt-4" style={{ borderTop: `2px dashed ${T.line}` }}>
              <div className="text-[13px] font-extrabold uppercase tracking-wider mb-3" style={{ color: "#10B981" }}>🤝 Match: {match.candName} × {match.name}{match.cached ? <span className="font-medium normal-case tracking-normal" style={{ color: T.faint }}> · uit teamcache</span> : null}</div>
              <Dossier text={match.dossier} />

      <p className="text-[11.5px] font-medium mt-2.5" style={{ color: T.faint }}>Enkel publieke informatie · dossiers 30 dagen gedeeld met het team · gebruik met respect 🤝</p>
    </>
  );
}

function linkify(text) {
  const parts = String(text).split(/(https?:\/\/[^\s)]+)/g);
  return parts.map((p, i) => /^https?:\/\//.test(p)
    ? <a key={i} href={p} target="_blank" rel="noreferrer" className="hover:underline break-all" style={{ color: T.blue }}>{p.replace("https://", "")}</a>
    : <span key={i}>{p}</span>);
}

function ChatView() {
  const [msgs, setMsgs] = useState([]);
  const [input, setInput] = useState("");
  const [busy, setBusy] = useState(false);
  const endRef = React.useRef(null);
  useEffect(() => { endRef.current?.scrollIntoView({ behavior: "smooth" }); }, [msgs, busy]);
  const send = () => {
    const q = input.trim();
    if (!q || busy) return;
    const next = [...msgs, { role: "user", content: q }];
    setMsgs(next); setInput(""); setBusy(true);
    fetch("/api/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ messages: next }) })
      .then(async (r) => { const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || `fout ${r.status}`);
        setMsgs((p) => [...p, { role: "assistant", content: d.answer }]); })
      .catch((e) => setMsgs((p) => [...p, { role: "assistant", content: "⚠️ " + String(e.message || e) }]))
      .finally(() => setBusy(false));
  };
  const suggestions = [
    "Welke vacatures vragen Kubernetes-expertise?",
    "Welke bedrijven zoeken al langer dan 30 dagen een data engineer?",
    "Waar maken onze kandidaten met React-ervaring de beste kans?",
  ];
  return (
    <>
      <PageHeader title="Assistent" subtitle="Stel vragen over de volledige vacaturedatabase — de AI zoekt en redeneert over alle open posities" />
      <div style={cardStyle} className="flex flex-col" >
        <div className="flex-1 overflow-y-auto p-5 flex flex-col gap-3" style={{ minHeight: "340px", maxHeight: "58vh" }}>
          {msgs.length === 0 && (
            <div className="text-center py-8">
              <p className="text-[14.5px] font-semibold mb-4" style={{ color: T.sub }}>Vraag bijvoorbeeld:</p>
              <div className="flex flex-col items-center gap-2">
                {suggestions.map((sug) => (
                  <button key={sug} onClick={() => setInput(sug)} className="text-[13px] font-medium px-3.5 py-2 rounded-[10px] transition-opacity hover:opacity-75" style={{ background: "#F4F5F9", color: T.ink, border: `1px solid ${T.line}` }}>{sug}</button>
                ))}
              </div>
            </div>
          )}
          {msgs.map((m, i) => (
            <div key={i} className={`max-w-[85%] px-3.5 py-2.5 rounded-[14px] text-[13.5px] font-medium leading-relaxed whitespace-pre-wrap ${m.role === "user" ? "self-end text-white" : "self-start"}`}
                 style={m.role === "user" ? { background: T.grad } : { background: "#F4F5F9", color: T.ink }}>
              {m.role === "assistant" ? linkify(m.content) : m.content}
            </div>
          ))}
          {busy && <div className="self-start px-3.5 py-2.5 rounded-[14px] text-[13.5px] font-medium" style={{ background: "#F4F5F9", color: T.faint }}>Zoekt in de database…</div>}
          <div ref={endRef} />
        </div>
        <div className="flex items-center gap-2 p-3" style={{ borderTop: `1px solid ${T.line}` }}>
          <input value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send()}
                 placeholder="Stel een vraag over de vacatures…" className="flex-1 px-3.5 h-10 rounded-[10px] text-[14px] font-medium outline-none" style={{ background: "#F4F5F9", border: `1px solid ${T.line}` }} />
          <button onClick={send} disabled={busy || !input.trim()} className="text-[13.5px] font-bold px-4 h-10 rounded-[10px] text-white transition-opacity hover:opacity-90 disabled:opacity-50" style={{ background: T.grad }}>Vraag</button>
        </div>
      </div>
      <p className="text-[12px] font-medium mt-2.5" style={{ color: T.faint }}>De assistent kijkt naar bedrijf, titel, stack, ouderdom en matches — en naar vacature-tekstfragmenten voor recent gescande posities. Gesprek wordt niet bewaard.</p>
    </>
  );
}

const PIPE_STAGES = [
  { id: "interesse", label: "Interesse", color: "#10B981" },
  { id: "voorgesteld", label: "Voorgesteld", color: "#4F6BFF" },
  { id: "feedback", label: "Feedback", color: "#F59E0B" },

];

function PipelineView({ enriched, wfApi, setLushaFor }) {
  if (!wfApi) {
    return (
      <>
        <PageHeader title="Pipeline" subtitle="Volg kandidaten van interesse tot plaatsing" />
        <div style={cardStyle} className="px-5 py-14 text-center">
          <p className="text-[15px] font-semibold" style={{ color: T.sub }}>Teamstatus niet beschikbaar</p>
          <p className="text-[13.5px] font-medium mt-1" style={{ color: T.faint }}>De pipeline werkt enkel op jobby.pages.dev (gedeelde teamdata achter de login)</p>
        </div>
      </>
    );
  }
  const byUrl = {};
  enriched.forEach((j) => { byUrl[j.url] = j; });
  const cards = Object.entries(wfApi.interests)
    .filter(([, v]) => v.status === "yes")
    .map(([k, v]) => {
      const jobUrl = k.slice(0, k.lastIndexOf("|"));
      const cand = v.cand || k.slice(k.lastIndexOf("|") + 1);
      const job = byUrl[jobUrl];
      return {
        key: k,
        cand,
        company: v.company || job?.company || "?",
        title: v.title || job?.title || "",
        url: jobUrl,
        stage: v.stage || "interesse",
        at: v.at,
        note: v.note || "",
        feedback: v.feedback || "",
      };
    })
    .sort((a, b) => (b.at || "").localeCompare(a.at || ""));

  const move = (card, dir) => {
    const i = PIPE_STAGES.findIndex((st) => st.id === card.stage);
    const next = PIPE_STAGES[i + dir];
    if (!next) return;
    wfApi.setStage(card.key, next.id);
    if (next.id === "feedback") wfApi.openFeedback(card.key, card.feedback || "");
  };

  return (
    <>
      <PageHeader title="Pipeline" subtitle="Elke kandidaat met interesse verschijnt hier automatisch — schuif ze door tot plaatsing" />
      <div className="grid grid-cols-1 md:grid-cols-4 gap-4 items-start">
        {PIPE_STAGES.map((st) => {
          const col = cards.filter((c) => c.stage === st.id);
          return (
            <div key={st.id} style={{ ...cardStyle, borderTop: `3px solid ${st.color}` }} className="p-3">
              <div className="flex items-center justify-between px-1 mb-2">
                <span className="text-[13px] font-extrabold tracking-tight">{st.label}</span>
                <span className="text-[11.5px] font-bold px-1.5 py-[1px] rounded-full" style={{ background: "#F1F2F7", color: T.sub }}>{col.length}</span>
              </div>
              <div className="flex flex-col gap-2">
                {col.map((c) => {
                  const claim = wfApi.claims[c.company];
                  return (
                    <div key={c.key} className="rounded-[12px] p-3 relative" style={{ background: "#FAFBFE", border: `1px solid ${T.line}` }}>
                      <button onClick={() => { if (confirm(`${c.cand} uit de pipeline verwijderen?`)) wfApi.setInterest(c.url, c.cand, null); }}
                              title="Verwijder uit pipeline"
                              className="absolute top-1.5 right-1.5 text-[13px] font-bold w-5 h-5 rounded-md leading-none hover:opacity-70"
                              style={{ color: T.faint, background: "transparent" }}>×</button>
                      <div className="text-[13.5px] font-bold leading-tight pr-5">{c.cand}</div>
                      <div className="text-[12.5px] font-semibold mt-0.5" style={{ color: T.sub }}>{c.company}</div>
                      {c.title && <div className="text-[11.5px] font-medium mt-0.5 leading-snug" style={{ color: T.faint }}>{c.title.slice(0, 70)}{c.title.length > 70 ? "…" : ""}</div>}
                      {c.stage === "feedback" && (
                        c.feedback ? (
                          <p role="button" onClick={() => wfApi.openFeedback(c.key, c.feedback)}
                             className="cursor-pointer text-[12px] font-medium mt-2 px-2.5 py-2 rounded-[9px] leading-snug"
                             style={{ background: "rgba(245,158,11,0.10)", color: "#92600A", border: "1px solid rgba(245,158,11,0.25)" }}
                             title="Klik om te bewerken">{c.feedback}</p>
                        ) : (
                          <button onClick={() => wfApi.openFeedback(c.key, "")}
                                  className="text-[11.5px] font-bold mt-2 px-2 py-1 rounded-md hover:opacity-80"
                                  style={{ background: "rgba(245,158,11,0.12)", color: "#B45309" }}>✎ Feedback ingeven</button>
                        )
                      )}
                      {byUrl[c.url]?.contact && (byUrl[c.url].contact.name || byUrl[c.url].contact.email) && (

                      )}
                      <button onClick={() => {

                        try {

                          const reg = h.split(".").slice(-2).join(".");

                      }}
                              className="w-full text-[11.5px] font-bold mt-2 px-2 py-1.5 rounded-md hover:opacity-80"
                              style={{ background: "rgba(79,107,255,0.08)", color: T.blue, border: "1px solid rgba(79,107,255,0.2)" }}>

                      </button>

function SheetSyncCard({ candidates, setCandidates }) {
  const [sheetUrl, setSheetUrl] = useState(() => { try { return localStorage.getItem("jobradar-sheet-url") || ""; } catch (e) { return ""; } });
  const [sheetBusy, setSheetBusy] = useState(false);
  const [sheetInfo, setSheetInfo] = useState(null);

  const syncSheet = async () => {
    if (!sheetUrl) return;
    setSheetBusy(true); setSheetInfo(null);
    try {
      const r = await fetch(sheetUrl);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const text = await r.text();
      if (text.trim().startsWith("<")) throw new Error("die link geeft een webpagina, geen CSV — gebruik Bestand → Delen → Publiceren op internet en kies CSV");
      const mapped = sheetRowsToCandidates(parseCsv(text));
      if (!mapped.length) throw new Error("geen kandidaatrijen gevonden");
      setCandidates(mapped);
      try { localStorage.setItem("jobradar-sheet-url", sheetUrl); } catch (e) {}
      setSheetInfo({ count: mapped.length, time: new Date().toLocaleTimeString("nl-BE", { hour: "2-digit", minute: "2-digit" }) });
    } catch (e) {
      setSheetInfo({ error: e.message });
    } finally {
      setSheetBusy(false);
    }
  };

  return (
    <div style={cardStyle} className="p-4 mt-5">
      <div className="flex items-center gap-2 mb-1">
        <RefreshCw size={14} color={T.blue} />
        <span className="text-[14.5px] font-bold tracking-tight">CV-database (voedt de AI-matching)</span>

        <div className="flex items-center gap-2 px-3 h-9 rounded-[10px] flex-1 min-w-[240px]" style={{ background: "#F4F5F9", border: `1px solid ${T.line}` }}>

const CONTRACTS_REPO = "JobbyBranch/contracten";   // owner/repo
const CONTRACTS_PATH = "contracts.json";
const CONTRACTS_BRANCH = "main";
const TUSSENPARTIJEN = ["Axxes", "Capgemini", "Cegeka", "Cronos", "Realdolmen", "Elmos", "Teksystems", "Vibe"];;

const b64encode = (str) => btoa(unescape(encodeURIComponent(str)));
const b64decode = (str) => decodeURIComponent(escape(atob((str || "").replace(/\n/g, ""))));

async function ghGetContracts(token) {
  const r = await fetch(`https://api.github.com/repos/${CONTRACTS_REPO}/contents/${CONTRACTS_PATH}?ref=${CONTRACTS_BRANCH}`, {
    headers: { Accept: "application/vnd.github+json", ...(token ? { Authorization: `Bearer ${token}` } : {}) },
    cache: "no-store",
  });
  if (r.status === 404) return { sha: null, data: [] };           // bestand bestaat nog niet
  if (!r.ok) throw new Error(`GitHub ${r.status}`);
  const j = await r.json();
  let data = [];
  try { data = JSON.parse(b64decode(j.content)); } catch (e) {}
  return { sha: j.sha, data: Array.isArray(data) ? data : [] };
}

async function ghSaveContracts(token, contracts) {
  // verse sha ophalen vlak vóór het schrijven → geen conflicten met oudere lokale sha
  const { sha } = await ghGetContracts(token);
  const r = await fetch(`https://api.github.com/repos/${CONTRACTS_REPO}/contents/${CONTRACTS_PATH}`, {
    method: "PUT",
    headers: { Accept: "application/vnd.github+json", Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
    body: JSON.stringify({
      message: "Contracten bijgewerkt via JobRadar",
      content: b64encode(JSON.stringify(contracts, null, 2)),
      branch: CONTRACTS_BRANCH,
      ...(sha ? { sha } : {}),
    }),
  });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.message || `GitHub ${r.status}`); }
}

const daysUntil = (iso) => {
  if (!iso) return null;
  const end = new Date(iso + "T23:59:59");
  return Math.ceil((end.getTime() - Date.now()) / 86400000);
};
const fmtDate = (iso) => {
  if (!iso) return "—";
  try { return new Date(iso).toLocaleDateString("nl-BE", { day: "numeric", month: "short", year: "numeric" }); } catch (e) { return iso; }
};

function EndDateBadge({ iso }) {
  const d = daysUntil(iso);
  if (d === null) return <span className="text-[13px] font-semibold" style={{ color: T.faint }}>Onbepaald</span>;
  const tone = d < 0 ? { fg: T.red, bg: T.redSoft, label: `verlopen (${Math.abs(d)}d)` }
    : d <= 60 ? { fg: T.amber, bg: T.amberSoft, label: `nog ${d}d` }
    : { fg: T.green, bg: T.greenSoft, label: `nog ${d}d` };
  return (
    <div className="flex items-center gap-2">
      <span className="text-[13.5px] font-semibold tabular-nums" style={{ color: T.ink }}>{fmtDate(iso)}</span>
      <span className="text-[11.5px] font-bold px-1.5 py-[2px] rounded-md whitespace-nowrap" style={{ color: tone.fg, background: tone.bg }}>{tone.label}</span>
    </div>
  );
}

/* ─────────── 1-ON-1 MATCHER (één CV tegen alle open vacatures) ─────────── */
let _pdfjsPromise = null;
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (!_pdfjsPromise) _pdfjsPromise = new Promise((res, rej) => {
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    sc.onload = () => {
      try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; } catch (e) {}
      res(window.pdfjsLib);
    };
    sc.onerror = () => rej(new Error("De PDF-lezer kon niet laden — controleer je internetverbinding of plak de CV-tekst."));
    document.head.appendChild(sc);
  });
  return _pdfjsPromise;
}

async function extractPdfText(file) {
  const lib = await loadPdfJs();
  const buf = await file.arrayBuffer();
  const doc = await lib.getDocument({ data: buf }).promise;
  const parts = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const page = await doc.getPage(p);
    const tc = await page.getTextContent();
    parts.push(tc.items.map((i) => i.str).join(" "));
  }
  return parts.join("\n\n").replace(/[ \t]+/g, " ").trim();
}

function buildMatcherPrompt(cvText, jobs) {
  const lines = jobs.map((j, i) => {
    const bits = [`#${i + 1}`, j.company, j.title];

    if (j.exp) bits.push(`ervaring: ${j.exp}`);
    return bits.join(" | ");
  });
  return [
    "Je bent een recruitment-matcher. Hieronder staat de tekst van één CV en daarna een genummerde lijst vacatures.",
    "Gebruik UITSLUITEND de vacatures uit de lijst hieronder — negeer elke andere vacaturedatabase die je kent.",
    "Screen het CV en scoor elke vacature uit de lijst op geschiktheid (0-100), op basis van skills, ervaring, senioriteit en rol.",
    "",
    "Antwoord UITSLUITEND met regels in exact dit formaat, zonder inleiding, uitleg of markdown:",
    "PROFIEL | naam | functietitel | jaren ervaring (getal) | max 8 kernskills gescheiden door komma's",
    "MATCH | vacaturenummer (het getal na #) | score (0-100) | bedrijf (letterlijk overgenomen) | vacaturetitel (letterlijk overgenomen) | één korte reden in het Nederlands",

function parseMatcherAnswer(answer) {
  const a = String(answer || "");
  const matches = [];
  let profiel = {};
  for (const rawLine of a.split(/\r?\n/)) {
    const line = rawLine.trim().replace(/^[-*>\s]+/, "");
    if (/^PROFIEL\s*\|/i.test(line)) {
      const p = line.split("|").map((x) => x.trim());
      profiel = { naam: p[1] || "", titel: p[2] || "", jaren: parseInt((p[3] || "").replace(/[^0-9]/g, ""), 10) || 0,
                  skills: (p[4] || "").split(",").map((x) => x.trim()).filter(Boolean).slice(0, 8) };
    } else if (/^MATCH\s*\|/i.test(line)) {
      const p = line.split("|").map((x) => x.trim());
      if (p.length >= 6) {
        matches.push({ id: p[1], score: parseInt((p[2] || "").replace(/[^0-9]/g, ""), 10) || 0, bedrijf: p[3], titel: p[4], reden: p.slice(5).join(" | ") });
      } else if (p.length >= 3) {
        // oud/ingekort formaat: nummer + score (+ evt. reden)
        matches.push({ id: p[1], score: parseInt((p[2] || "").replace(/[^0-9]/g, ""), 10) || 0, bedrijf: "", titel: "", reden: p.slice(3).join(" | ") });
      }
    }
  }
  if (matches.length || profiel.naam || profiel.titel) return { profiel, matches };
  // fallback: het model antwoordde toch met JSON
  const start = a.indexOf("{");
  const end = a.lastIndexOf("}");
  if (start !== -1 && end > start) {
    try {
      const d = JSON.parse(a.slice(start, end + 1));
      if (d && Array.isArray(d.matches)) return { profiel: d.profiel || {}, matches: d.matches };
    } catch (e) {}
  }
  throw new Error("geen PROFIEL/MATCH-regels of geldige JSON gevonden in het antwoord — begin van het antwoord: " + a.slice(0, 300));
}

/* Koppel een MATCH-regel aan een echte vacature: eerst op letterlijke titel+bedrijf, dan op nummer, dan fuzzy. */
function resolveMatchedJob(m, jobList) {
  const norm = (x) => String(x || "").trim().toLowerCase();
  const mt = norm(m.titel), mc = norm(m.bedrijf);
  if (mt) {
    let hit = jobList.find((j) => norm(j.title) === mt && (!mc || norm(j.company) === mc));
    if (hit) return hit;
    hit = jobList.find((j) => norm(j.title) === mt);
    if (hit) return hit;
    hit = jobList.find((j) => (norm(j.title).includes(mt) || mt.includes(norm(j.title))) && (!mc || norm(j.company) === mc));
    if (hit) return hit;
  }
  const n = parseInt(String(m.id).replace(/[^0-9]/g, ""), 10);
  if (n >= 1 && n <= jobList.length) {
    const byNr = jobList[n - 1];
    // nummer alleen vertrouwen als er geen tegenstrijdige titel bij staat
    if (!mt || norm(byNr.title).includes(mt) || mt.includes(norm(byNr.title))) return byNr;
  }
  const needle = `${String(m.titel)} ${String(m.reden || "")}`.toLowerCase();
  return jobList.find((j) => needle.includes(norm(j.title)) && needle.includes(norm(j.company))) || null;
}
