# schedule re-registered 27/07
name: JobRadar daily scan

on:
  schedule:
    - cron: '0 6 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SCAN_WORKERS: "12"
                - name: Fetch private CV database
        env:
          CV_DB_TOKEN: ${{ secrets.CV_DB_TOKEN }}
        run: |
          curl -sfL \
            -H "Authorization: Bearer $CV_DB_TOKEN" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/JobbyBranch/cv-database/contents/candidates.csv?ref=main" \
            -o "$RUNNER_TEMP/candidates.csv"
          echo "CANDIDATES_CSV_URL=$RUNNER_TEMP/candidates.csv" >> "$GITHUB_ENV"
        run: python scraper.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "jobradar-bot"
          git config user.email "bot@jobradar"
          git add state/ output/
          git diff --cached --quiet || git commit -m "daily scan"
          git pull --rebase origin main
          git push
